name: Export ROM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify ROM
        run: |
          test -s 2006aemiat.bin
          ls -lh 2006aemiat.bin
          sha256sum 2006aemiat.bin

      - name: Upload original ROM
        uses: actions/upload-artifact@v4
        with:
          name: 2006aemiat-rom
          path: 2006aemiat.bin
          if-no-files-found: error
          retention-days: 7
